<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>无畏契约商店 1:1复刻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #fff;
            width: 100%;
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 顶部深色导航栏 */
        .header {
            background: #0D1520;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 15px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF4554;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-inner {
            width: 17px;
            height: 17px;
            background: #0D1520;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 26% 50%);
        }
        .title {
            color: #fff;
            font-size: 16px;
        }
        .round-arrow {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1F2937;
            color: #fff;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #fff;
            font-size: 13px;
        }
        .day-num {
            width: 30px;
            height: 30px;
            background: #fff;
            color: #0D1520;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        /* 一级标签：商店/VCT/通行证 */
        .tab-top {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #E8E8E8;
        }
        .tab-top-item {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
            color: #868686;
            position: relative;
        }
        .tab-top-item.active {
            color: #000;
        }
        .tab-top-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 2px;
            background: #000;
        }

        /* 二级标签 每日商店 / 王国商店 */
        .tab-sub {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 15px;
        }
        .tab-sub-group {
            display: flex;
            gap: 7px;
        }
        .tab-sub-item {
            padding: 5px 16px;
            border-radius: 15px;
            background: #F1F1F1;
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }
        .tab-sub-item.active {
            background: #000;
            color: #fff;
        }

        /* 倒计时区域 */
        .count-box {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .time-cell {
            background: #000;
            color: #fff;
            padding: 4px 7px;
            border-radius: 2px;
            font-size: 13px;
        }
        .time-label {
            font-size: 12px;
            color: #333;
        }
        .refresh-svg {
            width: 20px;
            height: 20px;
            margin-left: 5px;
        }

        /* 商品卡片区域 */
        .card-container {
            flex: 1;
            padding: 0 15px;
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .goods-card {
            height: 142px;
            background: #1A232F;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        /* 卡片背景纹理 */
        .card-bg {
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="375" height="142"><defs><pattern id="grid" width="70" height="60" patternUnits="userSpaceOnUse"><path d="M0 30 L70 30 M35 0 L35 60" stroke="%233A4655" stroke-width="0.4" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)" opacity="0.65"/><path d="M-10 25 Q90 45 185 25 T380 25" stroke="%23546272" stroke-width="0.8" fill="none"/><path d="M-10 115 Q90 95 185 115 T380 25" stroke="%23546272" stroke-width="0.8" fill="none"/></svg>');
        }
        .q-wrapper {
            width: 66px;
            height: 66px;
            position: relative;
            z-index: 2;
        }
        .q-wrapper::before {
            content: "?";
            font-size: 40px;
            color: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        .q-wrapper::after {
            content: '';
            width: 100%;
            height: 100%;
            border: 1.8px solid #fff;
            transform: rotate(45deg);
            position: absolute;
            top: 0;
            left: 0;
        }
        /* 卡片图片样式：居中、铺满、不变形、不偏移 */
        .card-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
        }
        /* 卡片文字信息 */
        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: #fff;
            z-index: 4;
        }
        .card-name {
            font-size: 18px;
            font-weight: bold;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 14px;
        }

        /* 底部导航 */
        .footer {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 8px 0 4px;
            border-top: 1px solid #E8E8E8;
            background: #fff;
        }
        .footer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #949494;
            font-size: 10px;
        }
        .footer-item.active {
            color: #FF4554;
        }
        .footer-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 3px;
        }
        .add-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #FF4554;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }
        .add-btn::after {
            content: "+";
            color: #fff;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-inner"></div>
            </div>
            <div class="title">端游</div>
            <div class="round-arrow">›</div>
        </div>
        <div class="header-right">
            <span>已连续打卡</span>
            <div class="day-num">1</div>
            <span>天</span>
            <div class="round-arrow">▼</div>
        </div>
    </div>

    <!-- 一级标签 -->
    <div class="tab-top">
        <div class="tab-top-item active">商店</div>
        <div class="tab-top-item">VCT商店</div>
        <div class="tab-top-item">战斗通行证</div>
        <div class="tab-top-item">掌瓦通行证</div>
    </div>

    <!-- 二级标签+倒计时 -->
    <div class="tab-sub">
        <div class="tab-sub-group">
            <div class="tab-sub-item active">每日商店</div>
            <div class="tab-sub-item">王国商店</div>
        </div>
        <div class="count-box">
            <div class="time-cell" id="h">21</div>
            <span class="time-label">时</span>
            <div class="time-cell" id="m">44</div>
            <span class="time-label">分</span>
            <div class="time-cell" id="s">16</div>
            <span class="time-label">秒</span>
            <svg class="refresh-svg" viewBox="0 0 24 24" fill="#222">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
        </div>
    </div>

    <!-- 卡片列表（动态渲染 + 点击切换） -->
    <div class="card-container" id="cardContainer">
        <!-- JS动态生成卡片 -->
    </div>

    <!-- 底部导航（原生SVG图标，正常显示） -->
    <div class="footer">
        <div class="footer-item">
            <svg class="footer-icon" viewBox="0 0 24 24" fill="#949494">
                <path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>
            </svg>
            <span>首页</span>
        </div>
        <div class="footer-item">
            <svg class="footer-icon" viewBox="0 0 24 24" fill="#949494">
                <path d="M12 5.5c1.93 0 3.5 1.57 3.5 3.5S13.93 12.5 12 12.5 8.5 10.93 8.5 9s1.57-3.5 3.5-3.5zM4 17c0-2.67 5.33-4 8-4s8 1.33 8 4v2H4v-2z"/>
            </svg>
            <span>好友</span>
        </div>
        <div class="footer-item">
            <div class="add-btn"></div>
        </div>
        <div class="footer-item active">
            <svg class="footer-icon" viewBox="0 0 24 24" fill="#FF4554">
                <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <span>福利</span>
        </div>
        <div class="footer-item">
            <svg class="footer-icon" viewBox="0 0 24 24" fill="#949494">
                <path d="M12 5.5c1.93 0 3.5 1.57 3.5 3.5S13.93 12.5 12 12.5 8.5 10.93 8.5 9s1.57-3.5 3.5-3.5zM4 17c0-2.67 5.33-4 8-4s8 1.33 8 4v2H4v-2z"/>
            </svg>
            <span>我的</span>
        </div>
    </div>

    <script>
        // 按你文件夹里的图片顺序和文件名配置
        const cardData = [
            {
                imgSrc: "15cdebcc936285e3002e3b577ad13bcc.jpg",
                name: "A",
                want: "27",
                price: 1790
            },
            {
                imgSrc: "4042cd27905e48c5c5d1407fc5d7b39a.jpg",
                name: "B",
                want: "1.5",
                price: 1590
            },
            {
                imgSrc: "5870157b825fa0e116ad0ea2772ed86b.jpg",
                name: "C",
                want: "1.6",
                price: 890
            },
            {
                imgSrc: "abc23caededb8685df84af39d33cd5c6.jpg",
                name: "D",
                want: "32.2",
                price: 790
            }
        ];

        const container = document.getElementById('cardContainer');
        cardData.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'goods-card';
            card.innerHTML = `<div class="card-bg"></div><div class="q-wrapper"></div>`;
            let isShowImg = false;

            card.addEventListener('click', () => {
                isShowImg = !isShowImg;
                if (isShowImg) {
                    card.innerHTML = `
                        <div class="card-bg"></div>
                        <img class="card-img" src="${item.imgSrc}" alt="皮肤">
                        <div class="card-info">
                            <div class="card-name">${item.name}</div>
                            <div class="card-meta">
                                <span>${item.want}万人想要</span>
                                <span>⟳ ${item.price}</span>
                            </div>
                        </div>
                    `;
                } else {
                    card.innerHTML = `<div class="card-bg"></div><div class="q-wrapper"></div>`;
                }
            });
            container.appendChild(card);
        });

        // 倒计时
        function countDown() {
            const now = new Date();
            let target = new Date();
            target.setHours(8,0,0,0);
            if(now > target) target.setDate(target.getDate()+1);
            let diff = target - now;

            let h = Math.floor(diff / 3600000);
            let m = Math.floor((diff % 3600000) / 60000);
            let s = Math.floor((diff % 60000) / 1000);

            document.getElementById('h').innerText = String(h).padStart(2,'0');
            document.getElementById('m').innerText = String(m).padStart(2,'0');
            document.getElementById('s').innerText = String(s).padStart(2,'0');
        }
        countDown();
        setInterval(countDown,1000);
    </script>
</body>
</html>
